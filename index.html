<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Quantyra CR | Mantenimiento</title>
  <meta name="description" content="Quantyra CR se encuentra temporalmente en mantenimiento." />

  <style>
    :root {
      --bg: #f7f9fc;
      --text: #0f172a;
      --muted: #64748b;
      --line: rgba(15, 23, 42, 0.10);
      --cyan: #05c8f0;
      --blue: #2563eb;
      --purple: #6d35f2;
      --white: rgba(255, 255, 255, 0.86);
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.10);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(circle at 18% 16%, rgba(5, 200, 240, 0.16), transparent 30%),
        radial-gradient(circle at 84% 18%, rgba(37, 99, 235, 0.13), transparent 32%),
        radial-gradient(circle at 68% 82%, rgba(109, 53, 242, 0.10), transparent 32%),
        linear-gradient(180deg, #ffffff 0%, #f7f9fc 55%, #eef4fb 100%);
    }

    .background::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(15,23,42,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(15,23,42,0.03) 1px, transparent 1px);
      background-size: 58px 58px;
      mask-image: linear-gradient(to bottom, black, transparent 92%);
    }

    .rocket {
      position: fixed;
      left: -120px;
      bottom: 12vh;
      z-index: -1;
      font-size: clamp(34px, 5vw, 58px);
      animation: rocketMove 7.5s ease-in-out infinite;
      filter: drop-shadow(0 12px 22px rgba(37, 99, 235, 0.26));
    }

    .rocket::before {
      content: "🚀";
      display: block;
      transform: rotate(45deg);
    }

    .rocket::after {
      content: "";
      position: absolute;
      width: clamp(90px, 12vw, 170px);
      height: 10px;
      right: 70%;
      top: 60%;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, rgba(5, 200, 240, 0.58), rgba(109, 53, 242, 0.22));
      filter: blur(2px);
      transform: rotate(45deg);
      transform-origin: right center;
    }

    .card {
      width: min(760px, 100%);
      max-height: calc(100vh - 48px);
      max-height: calc(100dvh - 48px);
      padding: clamp(28px, 5vw, 56px);
      border: 1px solid var(--line);
      border-radius: clamp(28px, 5vw, 42px);
      background: var(--white);
      box-shadow: var(--shadow);
      backdrop-filter: blur(22px);
      overflow: hidden;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: clamp(26px, 5vw, 42px);
      font-weight: 900;
      letter-spacing: 0.17em;
      font-size: 0.95rem;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      color: #ffffff;
      font-weight: 950;
      letter-spacing: 0;
      background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
      box-shadow: 0 14px 34px rgba(37, 99, 235, 0.22);
    }

    .messages {
      display: grid;
      gap: 14px;
    }

    .message {
      padding: clamp(16px, 3vw, 22px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.72);
      text-align: left;
    }

    .lang {
      display: block;
      margin-bottom: 8px;
      color: var(--blue);
      font-size: 0.78rem;
      font-weight: 900;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .text {
      display: block;
      color: var(--text);
      font-size: clamp(1.05rem, 2.2vw, 1.32rem);
      line-height: 1.45;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    @keyframes rocketMove {
      0% {
        transform: translate(-10vw, 8vh) rotate(-8deg);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      50% {
        transform: translate(55vw, -48vh) rotate(4deg);
        opacity: 1;
      }
      85% {
        opacity: 1;
      }
      100% {
        transform: translate(120vw, -86vh) rotate(8deg);
        opacity: 0;
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 14px;
      }

      .card {
        max-height: calc(100vh - 28px);
        max-height: calc(100dvh - 28px);
        padding: 26px;
      }

      .brand {
        margin-bottom: 24px;
        font-size: 0.84rem;
        letter-spacing: 0.14em;
      }

      .brand-mark {
        width: 38px;
        height: 38px;
      }

      .messages {
        gap: 10px;
      }

      .message {
        border-radius: 18px;
        padding: 15px;
      }

      .text {
        font-size: 1rem;
        line-height: 1.38;
      }

      .rocket {
        font-size: 34px;
        animation-duration: 6.5s;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .rocket {
        animation: none;
        left: auto;
        right: 24px;
        bottom: 24px;
        opacity: 0.26;
      }
    }
  </style>
</head>

<body>
  <div class="background"></div>
  <div class="rocket" aria-hidden="true"></div>

  <main class="card" aria-label="Página en mantenimiento">
    <div class="brand">
      <div class="brand-mark">Q</div>
      <span>QUANTYRA</span>
    </div>

    <section class="messages">
      <div class="message">
        <span class="lang">Español</span>
        <span class="text">La página está en mantenimiento. Volveremos pronto.</span>
      </div>

      <div class="message">
        <span class="lang">English</span>
        <span class="text">This page is under maintenance. We will be back soon.</span>
      </div>

      <div class="message">
        <span class="lang">日本語</span>
        <span class="text">このページはメンテナンス中です。まもなく再開します。</span>
      </div>

      <div class="message">
        <span class="lang">Deutsch</span>
        <span class="text">Diese Seite wird derzeit gewartet. Wir sind bald wieder da.</span>
      </div>
    </section>
  </main>
</body>
</html>
